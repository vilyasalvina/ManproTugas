<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keisha | Portofolio Super Team</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f9e4ea;
      --grid: #eccbd4;
      --window: #b9dedb;
      --titlebar: #fdf8c2;
      --tag-kuning: #fff7c4;
      --tag-ungu: #c2c3da;
      --tag-pink: #f7e4ea;
      --text: #000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Pixelify Sans", monospace;
      color: var(--text);
      background-color: var(--bg);
      background-image:
        linear-gradient(var(--grid) 3px, transparent 3px),
        linear-gradient(90deg, var(--grid) 3px, transparent 3px);
      background-size: 48px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px 16px;
    }

    .beranda {
      align-self: flex-start;
      font-size: 20px;
      color: var(--text);
      text-decoration: none;
      background: var(--titlebar);
      padding: 8px 16px;
      border-radius: 100px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    .beranda:hover { background: #fff; }

    /* Ukuran jendela mengikuti desain Figma (952 x 630) dan menyusut di layar kecil.
       --u = 1px desain, dihitung dari lebar jendela. */
    .wadah {
      width: min(952px, 100%);
      container-type: inline-size;
    }

    .jendela {
      --u: calc(100cqw / 952);
      position: relative;
      width: 100%;
      aspect-ratio: 952 / 630;
      background: var(--window);
      border-radius: calc(26 * var(--u));
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.23), 0 16px 48px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .title-bar {
      position: absolute;
      inset: 0 0 auto 0;
      height: calc(62 * var(--u));
      background: var(--titlebar);
      display: flex;
      align-items: center;
      gap: calc(8 * var(--u));
      padding-left: calc(24 * var(--u));
    }
    .title-bar span {
      width: calc(14 * var(--u));
      height: calc(14 * var(--u));
      border-radius: 50%;
    }
    .title-bar .merah { background: #ff5f57; }
    .title-bar .kuning { background: #febc2e; }
    .title-bar .hijau { background: #28c840; }

    /* Area isi: padding desain 16px kiri/kanan, 64px atas */
    .isi {
      position: absolute;
      left: calc(16 * var(--u));
      top: calc(64 * var(--u));
      width: calc(920 * var(--u));
      height: calc(550 * var(--u));
    }

    .foto {
      position: absolute;
      left: calc(15 * var(--u));
      top: calc(38 * var(--u));
      width: calc(334 * var(--u));
      height: calc(475 * var(--u));
      border-radius: calc(30 * var(--u));
      object-fit: cover;
    }

    .nama {
      position: absolute;
      left: calc(15 * var(--u));
      top: calc(319 * var(--u));
      width: calc(578 * var(--u));
      height: calc(179 * var(--u));
      object-fit: cover;
    }

    .tag {
      position: absolute;
      left: calc(var(--x) * var(--u));
      top: calc(var(--y) * var(--u));
      transform: translate(-50%, -50%) rotate(var(--r, 0deg));
      padding: calc(12 * var(--u)) calc(16 * var(--u));
      border-radius: 100px;
      font-size: calc(32 * var(--u));
      line-height: 1;
      white-space: nowrap;
      list-style: none;
    }
    .tag.kuning { background: var(--tag-kuning); }
    .tag.ungu { background: var(--tag-ungu); }
    .tag.pink { background: var(--tag-pink); }

    .daftar { list-style: none; }

    /* Aktivitas terakhir (Siklus 2) */
    .tag.kecil {
      padding: calc(7.88 * var(--u)) calc(10.51 * var(--u));
      font-size: calc(21 * var(--u));
    }
    .aktivitas {
      position: absolute;
      left: calc(787.6 * var(--u));
      top: calc(384.9 * var(--u));
      width: calc(161 * var(--u));
      height: calc(201 * var(--u));
      transform: translate(-50%, -50%) rotate(7.28deg);
      object-fit: cover;
    }
    .status {
      position: absolute;
      left: calc(759.5 * var(--u));
      top: calc(510 * var(--u));
      transform: translate(-50%, -50%);
      font-size: calc(32 * var(--u));
      white-space: nowrap;
    }

    /* ---------- Siklus 3: tombol Surprise Me + pop-up kejutan ---------- */
    body { font-variant-ligatures: none; } /* supaya "fi" tidak menyatu di font pixel */
    .surprise {
      position: absolute;
      left: calc(735 * var(--u));
      top: calc(8 * var(--u));
      height: calc(46 * var(--u));
      padding: 0 calc(14.6 * var(--u));
      border: 0;
      border-radius: 100px;
      background: #f57e9a;
      color: #fff;
      font: inherit;
      font-size: calc(29.22 * var(--u));
      white-space: nowrap;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .surprise:hover, .surprise:focus-visible { transform: scale(1.06) rotate(-2deg); }

    .kejutan {
      margin: auto;
      padding: 0;
      border: 0;
      width: min(360px, calc(100vw - 32px));
      border-radius: 22px;
      background: var(--window);
      color: var(--text);
      font-family: inherit;
      text-align: center;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.23), 0 16px 48px rgba(0, 0, 0, 0.35);
    }
    .kejutan::backdrop { background: rgba(60, 40, 50, 0.3); }
    .kejutan[open] { animation: muncul 0.25s ease-out; }
    @keyframes muncul {
      from { transform: scale(0.7) rotate(-6deg); opacity: 0; }
      to { transform: none; opacity: 1; }
    }
    .kejutan-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      background: var(--titlebar);
      font-size: 18px;
    }
    .kejutan-bar i { display: block; width: 12px; height: 12px; border-radius: 50%; }
    .kejutan-bar b { margin-left: 8px; font-weight: 500; }
    .kejutan-emoji { margin-top: 18px; font-size: 64px; line-height: 1; }
    .kejutan-teks { padding: 12px 22px 4px; font-size: 22px; line-height: 1.35; }
    .kejutan-aksi { display: flex; justify-content: center; gap: 10px; padding: 14px 16px 20px; }
    .kejutan-aksi button {
      border: 0;
      border-radius: 100px;
      padding: 10px 20px;
      background: #f57e9a;
      color: #fff;
      font: inherit;
      font-size: 18px;
      cursor: pointer;
    }
    .kejutan-aksi button.tutup { background: #fff; color: #000; }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <a class="beranda" href="index.html">&larr; Beranda</a>

  <main class="wadah">
    <div class="jendela">
      <div class="title-bar">
        <span class="merah" aria-hidden="true"></span>
        <span class="kuning" aria-hidden="true"></span>
        <span class="hijau" aria-hidden="true"></span>
        <button class="surprise" id="tombol-surprise" type="button">* Suprise Me!</button>
      </div>

      <div class="isi">
        <h1 class="sr-only">Keisha Neira</h1>
        <img class="foto" src="img/keisha/foto.png" alt="Foto profil Keisha">
        <img class="nama" src="img/keisha/nama.png" alt="Keisha">

        <section aria-label="Hobi">
          <h2 class="tag kuning" style="--x: 437; --y: 78; font-weight: 400;">Hobi</h2>
          <ul class="daftar">
            <li class="tag kuning" style="--x: 521; --y: 160; --r: 9.06deg;">Masak</li>
            <li class="tag kuning" style="--x: 448; --y: 240; --r: -5.04deg;">Basket</li>
          </ul>
        </section>

        <section aria-label="Keahlian">
          <h2 class="tag pink" style="--x: 760; --y: 74; --r: 3.43deg; font-weight: 400;">Keahlian</h2>
          <ul class="daftar">
            <li class="tag pink" style="--x: 793; --y: 160; --r: -4.9deg;">UI/UX</li>
            <li class="tag pink" style="--x: 696; --y: 226; --r: 8.55deg;">Java</li>
          </ul>
        </section>

        <section aria-label="Aktivitas terakhir">
          <img class="aktivitas" src="img/keisha/aktivitas-working.jpg" alt="Foto Keisha sedang bekerja bersama tim">
          <h2 class="tag ungu kecil" style="--x: 760; --y: 304; --r: -8.39deg; font-weight: 400;">*Recent Activity*</h2>
          <p class="status">Working</p>
        </section>
      </div>
    </div>
  </main>
  <!-- Siklus 3: pop-up kejutan (isi diacak oleh JavaScript) -->
  <dialog class="kejutan" id="kejutan" aria-labelledby="kejutan-judul">
    <div class="kejutan-isi">
      <div class="kejutan-bar">
        <i style="background: #ff5f57;"></i><i style="background: #febc2e;"></i><i style="background: #28c840;"></i>
        <b id="kejutan-judul">Surprise!</b>
      </div>
      <p class="kejutan-emoji" id="kejutan-emoji" aria-hidden="true"></p>
      <p class="kejutan-teks" id="kejutan-teks"></p>
      <div class="kejutan-aksi">
        <button type="button" id="kejutan-lagi">Lagi!</button>
        <button type="button" class="tutup" id="kejutan-tutup">Tutup</button>
      </div>
    </div>
  </dialog>

  <script>
    // Siklus 3: tombol Surprise Me -> pop-up dengan isi acak yang lucu.
    (function () {
      var daftar = [
        { emoji: "🍳", teks: "Fun fact: masak sambil mikirin UI/UX itu bisa." },
        { emoji: "🏀", teks: "Basket dulu, tugas kemudian. Jangan bilang PM ya!" },
        { emoji: "☕", teks: "Java: bukan kopi, tapi tetap bikin melek." },
        { emoji: "💼", teks: "Status: Working... mohon jangan diganggu." },
        { emoji: "🎟️", teks: "Selamat! Kamu dapat 1 tiket cicip masakan Keisha." },
        { emoji: "📐", teks: "Geser 1 pixel ke kiri. Nah, pas." }
      ];

      var dialog = document.getElementById("kejutan");
      var tombol = document.getElementById("tombol-surprise");
      if (!dialog || !tombol || typeof dialog.showModal !== "function") return;

      var emoji = document.getElementById("kejutan-emoji");
      var teks = document.getElementById("kejutan-teks");
      var terakhir = -1;

      // Pilih isi secara acak, tapi jangan sama dengan yang baru saja muncul.
      function acak() {
        var i;
        do { i = Math.floor(Math.random() * daftar.length); } while (i === terakhir);
        terakhir = i;
        emoji.textContent = daftar[i].emoji;
        teks.textContent = daftar[i].teks;
      }

      tombol.addEventListener("click", function () { acak(); dialog.showModal(); });
      document.getElementById("kejutan-lagi").addEventListener("click", acak);
      document.getElementById("kejutan-tutup").addEventListener("click", function () { dialog.close(); });
      // Klik di luar pop-up menutupnya.
      dialog.addEventListener("click", function (e) { if (e.target === dialog) dialog.close(); });
    })();
  </script>
</body>
</html>
